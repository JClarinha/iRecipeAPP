<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form (ngSubmit)="onSubmit()">
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>

                
                <div *ngIf="loading" class="loading-spinner">
                  <div class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                  </div>
                </div>

                <c-input-group class="mb-3">
                  <span cInputGroupText>&#64;</span>
                  <input
                    autocomplete="email"
                    [(ngModel)]="email"
                    name="email"
                    cFormControl
                    placeholder="Enter your email"
                    required
                  />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autocomplete="current-password"
                    [(ngModel)]="password"
                    name="password"
                    cFormControl
                    placeholder="Enter your password"
                    type="password"
                    required
                    [type]="showPassword ? 'text' : 'password'"
                    style="padding-right: 40px;"
                  />
                  <span (click)="togglePasswordVisibility()"
                    style="cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                    <i [ngClass]="showPassword ? 'fas fa-eye' : 'fas fa-eye-slash'" class="icon-eye"></i>
                  </span>
                </c-input-group>
                <c-row>
                  <c-col xs="6">
                    <button cButton class="px-4" color="primary" type="submit" [disabled]="loading">
                      Login
                    </button>
                  </c-col>
                  <c-col class="text-right" xs="6">
                    <button cButton class="px-0" color="link" (click)="navigateToForgotPw()">
                      Forgot password?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [ngStyle]="{'min-width.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>Sign up</h2>
                <p>
                  Join our culinary community! Save your favorite recipes, share your own, and connect with fellow food lovers. Discover delicious dishes, leave comments, and get inspired. Start your recipe adventure today!
                </p>
                <button [active]="true" cButton class="mt-3" color="primary" (click)="navigateToRegister()">
                  Register Now!
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
