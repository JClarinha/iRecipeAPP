<h4 class="text-center">Register New User</h4>
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

  <!-- Campo Nome -->
  <div class="form-group mb-3">
    <label for="name">Name</label>
    <input type="text" id="name" class="form-control" formControlName="name" placeholder="Enter your name">
    <div *ngIf="isFieldInvalid('name')" class="text-danger">
      Name is required (min. 2 characters).
    </div>
  </div>

  <!-- Campo Email -->
  <div class="form-group mb-3">
    <label for="email">Email</label>
    <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email">
    <div *ngIf="isFieldInvalid('email')" class="text-danger">
      Please enter a valid email (must end with .com, .pt, or .net).
    </div>
  </div>

  <!-- Campo Password -->
  <div class="form-group mb-3">
    <label for="password" class="form-label">Password</label>
    <div class="position-relative">
      <input formControlName="password" autoComplete="new-password" 
        class="form-control" placeholder="Password"
        [type]="showPassword ? 'text' : 'password'" 
        [ngClass]="{'is-invalid': isFieldInvalid('password')}" />
        
      <!-- Ícone do olho alinhado à direita dentro do campo -->
      <span (click)="togglePasswordVisibility()"
        style="cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
        <i [ngClass]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" class="icon-eye"></i>
      </span>
      
      <div *ngIf="isFieldInvalid('password')" class="text-danger invalid-feedback">
        Password must be at least 6 characters, with at least 1 uppercase letter and 1 special character.
      </div>
    </div>
  </div>
  
  <!-- Botão de Registo -->
  <button type="submit" class="btn btn-primary btn-block"  [disabled]="loading || registerForm.invalid">
    Register
  </button>

</form>
