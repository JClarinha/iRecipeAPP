<div class="container mt-5">
  <h2 class="text-center">User List</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Admin</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users;">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
          <input type="checkbox" [(ngModel)]="user.admin" (change)="onAdminCheckboxChange(user)" />
        </td>
        <td>

          <button (click)="deleteUser(user.id)" class="btn btn-danger btn-remove" title="Delete User">
            <fa-icon [icon]="faTrashCan"></fa-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="text-center mt-4 bottom-right">
    <button class="btn btn-success" (click)="saveAdminChanges()">Save Changes</button>
  </div>
</div>
